<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Warspear Quest To-Do</title>
    <!-- Пиксельный шрифт с поддержкой кириллицы и NES.css -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #16131c;
            color: #e6d6b8;
            font-size: 11px;
            margin: 0;
            padding: 15px;
            image-rendering: pixelated;
        }
        .warspear-panel {
            background: #282130;
            border: 4px solid #6b5535 !important;
            box-shadow: inset 0 0 12px #000;
            margin-bottom: 16px;
        }
        /* Сетка дней недели */
        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 15px;
        }
        .quest-card {
            background: #1f1924;
            border: 3px solid #4a3c2c;
            padding: 10px;
            margin-bottom: 12px;
            position: relative;
        }
        .quest-card.in_battle {
            border-color: #f7d51d;
            animation: pulse-border 1.2s infinite alternate;
        }
        .quest-card.defeated {
            opacity: 0.55;
            border-color: #209cee;
        }
        @keyframes pulse-border {
            from { box-shadow: 0 0 4px #f7d51d; }
            to { box-shadow: 0 0 14px #e76e55; }
        }
        .tag-badge {
            display: inline-block;
            padding: 3px 6px;
            font-size: 8px;
            background: #3c2f4f;
            border: 2px solid #8c7355;
            margin-right: 4px;
            margin-top: 4px;
        }
        /* Арена битвы с монстром */
        #battle-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .arena-stage {
            width: 720px;
            max-width: 95%;
            height: 320px;
            border: 4px solid #c89d54;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 40px;
            overflow: hidden;
        }
        .sprite-unit {
            width: 110px;
            height: 110px;
            object-fit: contain;
            image-rendering: pixelated;
            transition: transform 0.25s ease;
        }
        /* Анимации удара и смерти монстра */
        .hero-lunge {
            transform: translateX(220px) scale(1.25) !important;
        }
        .monster-hit {
            filter: brightness(3) invert(1) sepia(1) saturate(5) hue-rotate(-50deg);
            transform: shake 0.3s;
        }
        .monster-dead {
            transform: scale(0) rotate(180deg);
            opacity: 0;
            transition: all 0.7s ease-in;
        }
        .damage-popup {
            position: absolute;
            top: 60px;
            right: 170px;
            color: #ff3860;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            display: none;
            animation: floatUp 1s forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-60px); opacity: 0; }
        }
        /* Календарь */
        .cal-table { width: 100%; border-collapse: collapse; }
        .cal-table td, .cal-table th {
            border: 2px solid #59442b;
            padding: 8px;
            vertical-align: top;
            height: 75px;
            width: 14.2%;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
